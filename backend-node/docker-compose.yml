# Local Postgres for VANI development.
# Start with:  docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: vani-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vani
      POSTGRES_PASSWORD: vani
      POSTGRES_DB: vani_db
    ports:
      - "5439:5432"
    volumes:
      - vani_pgdata:/var/lib/postgresql/data

volumes:
  vani_pgdata:
